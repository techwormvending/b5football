# Nightly nflverse finalization (build rule 5). Rescores every unlocked week from
# nflverse, logs live-vs-final differences and stat corrections, and
# auto-finalizes weeks past their deadline. See CLAUDE.md, "Live scoring and finalization".
#
# Storage (INTERIM until the backend exists): the league data folder lives on the
# `league-data` branch, never on `main`, so GitHub Pages doesn't serve it. Each run
# checks it out, updates it and commits it back. The repo is public, so that
# branch is too: it holds scores, diff logs, review items and the audit log.
# No secrets are needed (nflverse and ESPN are public).
#
# Actions cron runs in UTC and can start late; that's fine for a nightly job.
# Note: GitHub disables scheduled workflows in public repos after 60 days with no
# repository activity. Re-enable it in the Actions tab before the season if it stops.

name: Nightly finalization

on:
  schedule:
    - cron: "17 9 * * *"     # 09:17 UTC daily = 5:17 AM EDT / 4:17 AM EST (off the hour to dodge the rush)
  workflow_dispatch:
    inputs:
      season:
        description: "Season (blank = current, from ESPN)"
        required: false
      through_week:
        description: "Finalize weeks 1 through this week (blank = current)"
        required: false

permissions:
  contents: write            # push to the league-data branch

concurrency:
  group: finalize
  cancel-in-progress: false  # never interrupt a run that is writing league data

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check out league data (league-data branch)
        run: |
          if git ls-remote --exit-code --heads origin league-data > /dev/null; then
            git fetch --depth=1 origin league-data
            git worktree add league-store FETCH_HEAD
          else
            git worktree add --orphan -b league-data league-store
          fi

      - name: Finalize
        id: finalize
        env:
          B5_DATA: league-store/league
          B5_ACTOR: github-actions
          # Repository variable AUTO_FINALIZE: "off" or "<weekday 0-6>@<hour 0-23>" US Eastern. Default Tue 11 PM.
          AUTO_FINALIZE: ${{ vars.AUTO_FINALIZE || '2@23' }}
          SEASON: ${{ inputs.season }}
          THROUGH_WEEK: ${{ inputs.through_week }}
        run: node scripts/finalize.mts $SEASON $THROUGH_WEEK

      # NFL players and schedule (kickoff times) for lineups: the database locks each
      # player at his game's kickoff from public.nfl_games. Independent of finalization.
      - name: Sync NFL players and schedule to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL variable or SUPABASE_SERVICE_ROLE_KEY secret not set; skipping NFL sync."
            exit 0
          fi
          node scripts/sync-nfl.mts

      # TEMPORARY (2026 shadow season): mirror MFL's rosters into roster_entries and flag
      # unmatched players for review. Delete with the other MFL code after the migration.
      - name: Sync 2026 rosters from MFL to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL variable or SUPABASE_SERVICE_ROLE_KEY secret not set; skipping roster sync."
            exit 0
          fi
          node scripts/sync-mfl-rosters.mts 2026

      # TEMPORARY (2026 shadow season): our engine vs MFL each week, and publish scores,
      # mirrored lineups, matchups and standings to Supabase. Delete after the migration.
      - name: Shadow scoring vs MFL; publish weeks to Supabase
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        env:
          B5_DATA: league-store/league
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL variable or SUPABASE_SERVICE_ROLE_KEY secret not set; skipping shadow scoring."
            exit 0
          fi
          node scripts/shadow.mts 2026 | tee shadow.txt
          { echo '### Shadow scoring vs MFL'; echo '```'; grep -E '^(Week|Summary|  [0-9]{4}:|    )' shadow.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # TEMPORARY (2026): MFL's Survivor and Confidence picks, read-only here. Delete after the migration.
      - name: Import 2026 pool picks from MFL
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::warning::Supabase not configured; skipping."; exit 0; fi
          node scripts/import-mfl-pools.mts 2026

      # Payouts: auto awards, guillotine and flags from this site's scores (rules: src/league/payouts.ts).
      - name: Recompute payouts
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::warning::Supabase not configured; skipping payouts."; exit 0; fi
          node scripts/payouts.mts 2026 | tee payouts.txt
          { echo '### Payouts'; echo '```'; cat payouts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # B5 Bot: weekly recap once a week is final, payout awards as they become final (toggles in Commish).
      - name: Message board bot
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::warning::Supabase not configured; skipping."; exit 0; fi
          node scripts/board-bot.mts 2026 | tee bot.txt
          { echo '### B5 Bot'; echo '```'; cat bot.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Free-tier Supabase projects pause after ~7 days without activity. The PRIMARY
      # keep-alive is the Cloudflare Worker cron (workers/keepalive, heartbeat
      # "cloudflare-cron"), which GitHub's 60-day schedule shutoff can't stop. This
      # step is a BACKUP ("nightly") and also warns here if the Worker's heartbeat
      # is missing or more than 3 days old.
      # Needs repository variable SUPABASE_URL and secret SUPABASE_SERVICE_ROLE_KEY.
      - name: Keep Supabase awake (backup) and check the Worker heartbeat
        if: always()
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL variable or SUPABASE_SERVICE_ROLE_KEY secret not set; skipping heartbeat."
            exit 0
          fi
          # Accept the variable with or without the dashboard's "/rest/v1/" suffix.
          SUPABASE_URL="${SUPABASE_URL%/}"; SUPABASE_URL="${SUPABASE_URL%/rest/v1}"; SUPABASE_URL="${SUPABASE_URL%/}"
          # Legacy service_role keys are JWTs (eyJ...) and also go in Authorization;
          # new sb_secret_ keys go in apikey only.
          auth=()
          case "$SUPABASE_SERVICE_ROLE_KEY" in eyJ*) auth=(-H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY");; esac
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/heartbeats?on_conflict=name" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "${auth[@]}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{\"name\":\"nightly\",\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "Supabase heartbeat: HTTP $code"
          case "$code" in 2*) ;; *) echo "::error::Supabase heartbeat failed (HTTP $code)"; exit 1;; esac

          # Is the primary (Cloudflare Worker) keep-alive still running?
          cf=$(curl -sS "$SUPABASE_URL/rest/v1/heartbeats?name=eq.cloudflare-cron&select=at" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" "${auth[@]}" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try { const r = JSON.parse(s); console.log(Array.isArray(r) && r[0] ? r[0].at : ""); } catch { console.log(""); }
              })')
          if [ -z "$cf" ]; then
            echo "::warning::The Cloudflare keep-alive Worker has never written a heartbeat. Deploy workers/keepalive (see CLAUDE.md)."
          else
            age_h=$(( ( $(date -u +%s) - $(date -u -d "$cf" +%s) ) / 3600 ))
            echo "Cloudflare keep-alive last ran $age_h hours ago ($cf)."
            if [ "$age_h" -gt 72 ]; then
              echo "::warning::The Cloudflare keep-alive heartbeat is $age_h hours old (over 3 days). Check the b5-keepalive Worker."
            fi
          fi

      # Save whenever finalization worked, even if the heartbeat step failed.
      - name: Save league data
        if: ${{ always() && steps.finalize.outcome == 'success' }}
        working-directory: league-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Nightly finalization $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:league-data
