# Run the official Confidence Pool import for chosen weeks (2026 test mode; MFL is official).
# Manual only: Actions > "Import official pool picks" > Run workflow. Used for the weeks 1-6
# backfill; the weekly run is scheduled in the database (Tuesdays 6:00 AM ET).
#   via = direct  runs the import here (service role)
#   via = edge    asks the database to start it through the b5-live Edge Function, exactly as
#                 the Tuesday schedule and the Commish "Run import now" button do (end-to-end check)
# No MFL credentials: MFL's pool export and results page are public.
name: Import official pool picks

on:
  workflow_dispatch:
    inputs:
      season:
        description: Season
        default: "2026"
      weeks:
        description: Weeks (space-separated)
        default: "1 2 3 4 5 6"
      via:
        description: direct (run here) or edge (through the database and the Edge Function)
        type: choice
        options: [direct, edge]
        default: direct

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Import (direct)
        if: inputs.via == 'direct'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEASON: ${{ inputs.season }}
          WEEKS: ${{ inputs.weeks }}
        run: |
          node scripts/pool-import.mts "$SEASON" $WEEKS | tee import.txt
          { echo '### Official pool import'; echo '```'; cat import.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Import through the database and the Edge Function
        if: inputs.via == 'edge'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SEASON: ${{ inputs.season }}
          WEEKS: ${{ inputs.weeks }}
        run: |
          q() { npx supabase db query --project-ref "$PROJECT_REF" --linked "$1"; }
          for w in $WEEKS; do q "select private.request_pool_import($SEASON, $w, 'backfill')"; done
          sleep 45
          q "select week, status, source, attempts, picks, teams, message, succeeded_at from public.pool_imports where season = $SEASON order by week" | tee import.txt
          { echo '### Official pool import (via the Edge Function)'; echo '```'; cat import.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
