# Deploy the keep-alive Cloudflare Worker (workers/keepalive, "b5-keepalive").
# Manual only: Actions > "Deploy keep-alive Worker" > Run workflow.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with ONE permission: Account > Workers Scripts > Edit
#                          (scoped to the one account). Nothing else.
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID (dashboard > Workers & Pages, right side)
#   SUPABASE_SERVICE_ROLE_KEY  (already set) becomes the Worker's secret, never printed.
name: Deploy keep-alive Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/keepalive
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check configuration
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi

      # Deploy first (creates the Worker on the first run), then set its secret.
      - name: Deploy
        run: npx --yes wrangler@4.145.0 deploy

      - name: Set the Worker's Supabase key (secret, not printed)
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4.145.0 secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Summary
        run: |
          {
            echo "### b5-keepalive deployed"
            echo "Cron: 06:13 and 18:13 UTC. The commissioner banner clears after the first run writes the \`cloudflare-cron\` heartbeat."
          } >> "$GITHUB_STEP_SUMMARY"
