# Deploy a Cloudflare Worker: workers/keepalive ("b5-keepalive") or workers/live ("b5-live").
# Manual only: Actions > "Deploy Worker" > Run workflow > pick the worker.
# b5-live needs Workers Paid: a Sunday slate exceeds the Free plan's CPU limit per run.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with ONE permission: Account > Workers Scripts > Edit
#                          (scoped to the one account). Nothing else.
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID (dashboard > Workers & Pages, right side)
#   SUPABASE_SERVICE_ROLE_KEY  (already set) becomes the Worker's secret, never printed.
name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        type: choice
        options: [keepalive, live]
        default: keepalive

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/${{ inputs.worker }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check configuration
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$RAW_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          # A pasted account ID often carries spaces or a newline: strip whitespace. Anything else
          # wrong is reported by shape only (the value is never printed).
          id=$(printf "%s" "$RAW_ACCOUNT_ID" | tr -d "[:space:]")
          if ! printf "%s" "$id" | grep -Eq "^[0-9a-f]{32}$"; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be the 32-character hex Account ID (Cloudflare > Workers & Pages, right side). After removing whitespace it is ${#id} characters$(printf "%s" "$id" | grep -q "[^0-9a-f]" && echo ", with characters other than 0-9 a-f")."
            exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      # The live Worker bundles shared code from src/ (wrangler/esbuild); nothing to install.
      # Deploy first (creates the Worker on the first run), then set its secret.
      - name: Deploy
        run: npx --yes wrangler@4.145.0 deploy

      - name: Set the Worker's Supabase key (secret, not printed)
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4.145.0 secret put SUPABASE_SERVICE_ROLE_KEY

      - name: Summary
        run: |
          {
            if [ "${{ inputs.worker }}" = keepalive ]; then
              echo "### b5-keepalive deployed"
              echo "Cron: 06:13 and 18:13 UTC. The commissioner banner clears after the first run writes the \`cloudflare-cron\` heartbeat."
            else
              echo "### b5-live deployed"
              echo "Cron: every minute. Outside game windows each run makes one ESPN request and stops."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
