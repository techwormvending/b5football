# Deploy a Cloudflare Worker: workers/keepalive ("b5-keepalive") or workers/live ("b5-live").
# Manual only: Actions > "Deploy Worker" > Run workflow > pick the worker.
# b5-live needs Workers Paid: a Sunday slate exceeds the Free plan's CPU limit per run.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   API token with ONE permission: Account > Workers Scripts > Edit
#                          (scoped to the one account). Nothing else.
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account ID (dashboard > Workers & Pages, right side)
#   SUPABASE_SERVICE_ROLE_KEY  (already set) becomes the Worker's secret, never printed.
name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Which Worker
        type: choice
        options: [keepalive, live]
        default: keepalive

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/${{ inputs.worker }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check configuration
        env:
          RAW_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$RAW_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          # A pasted account ID often carries spaces or a newline: strip whitespace. Anything else
          # wrong is reported by shape only (the value is never printed).
          id=$(printf "%s" "$RAW_ACCOUNT_ID" | tr -d "[:space:]")
          if ! printf "%s" "$id" | grep -Eq "^[0-9a-f]{32}$"; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be the 32-character hex Account ID (Cloudflare > Workers & Pages, right side). After removing whitespace it is ${#id} characters$(printf "%s" "$id" | grep -q "[^0-9a-f]" && echo ", with characters other than 0-9 a-f")."
            exit 1
          fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      # Cron triggers need the ACCOUNT's workers.dev subdomain to exist (Cloudflare error 10063),
      # even though our Workers have no public URL. Check it for the configured account.
      - name: Check the account's workers.dev subdomain
        run: |
          out=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "$out" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              let j; try { j = JSON.parse(s); } catch { console.log("::warning::Unexpected answer from Cloudflare"); return; }
              if (j.success && j.result && j.result.subdomain) { console.log("workers.dev subdomain for this account: " + j.result.subdomain); return; }
              const errs = (j.errors || []).map(e => e.code + " " + e.message).join("; ");
              console.log("::error::No workers.dev subdomain on the account in CLOUDFLARE_ACCOUNT_ID (" + (errs || "none set") + "). Open Workers & Pages for THAT account (check the account switcher; the ID is in the dashboard URL) and finish the subdomain setup.");
              process.exit(1);
            });'

      # The live Worker bundles shared code from src/ (wrangler/esbuild); nothing to install.
      # Deploy first (creates the Worker on the first run), then set its secret.
      - name: Deploy
        run: npx --yes wrangler@4.145.0 deploy

      - name: Set the Worker's Supabase key (secret, not printed)
        run: printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx --yes wrangler@4.145.0 secret put SUPABASE_SERVICE_ROLE_KEY

      # Read back from Cloudflare what the dashboard shows: the script exists, its cron
      # schedules, and that it has no workers.dev URL.
      - name: Verify on Cloudflare
        run: |
          name=$(sed -n 's/^name *= *"\(.*\)"/\1/p' wrangler.toml)
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          sched=$(curl -sS "${auth[@]}" "$api/schedules")
          sub=$(curl -sS "${auth[@]}" "$api/subdomain")
          SCHED="$sched" SUB="$sub" NAME="$name" node -e '
            const s = JSON.parse(process.env.SCHED), d = JSON.parse(process.env.SUB);
            if (!s.success) { console.log("::error::" + process.env.NAME + ": schedules not readable: " + JSON.stringify(s.errors)); process.exit(1); }
            const crons = (s.result.schedules || []).map(x => x.cron);
            console.log(process.env.NAME + " cron schedules on Cloudflare: " + (crons.join(", ") || "NONE"));
            console.log(process.env.NAME + " workers.dev URL: " + (d.success ? (d.result.enabled ? "ENABLED" : "disabled") : "unknown " + JSON.stringify(d.errors)));
            if (!crons.length) { console.log("::error::No cron schedule registered"); process.exit(1); }
            if (d.success && d.result.enabled) { console.log("::error::workers.dev URL is enabled; expected disabled"); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, "Cloudflare reports: crons " + crons.join(", ") + "; workers.dev URL " + (d.success ? (d.result.enabled ? "enabled" : "disabled") : "unknown") + "\n\n");
          '

      - name: Summary
        run: |
          {
            if [ "${{ inputs.worker }}" = keepalive ]; then
              echo "### b5-keepalive deployed"
              echo "Cron: 06:13 and 18:13 UTC. The commissioner banner clears after the first run writes the \`cloudflare-cron\` heartbeat."
            else
              echo "### b5-live deployed"
              echo "Cron: every minute. Outside game windows each run makes one ESPN request and stops."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
